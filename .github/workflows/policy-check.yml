name: Policy Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    env:
      POLICY_PROFILE: flat
      POLICY_VERSION: "1.0.0"
      POLICY_ENGINE_REF: 8454aa1967b752ea38c82edd79a8439b5bde915b
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate policy_engine_ref is a full 40-character commit SHA
        shell: bash
        run: |
          if ! [[ "$POLICY_ENGINE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: policy_engine_ref must be a full 40-character lowercase hex commit SHA."
            echo "Got: '$POLICY_ENGINE_REF'"
            echo "Tip: use \${{ github.sha }} (self-dogfood) or a pinned full SHA"
            echo "     from hamanpaul/paulsha-conventions (not a tag, not a short SHA, not a branch ref)."
            exit 1
          fi

      - name: Checkout policy engine
        uses: actions/checkout@v4
        with:
          repository: hamanpaul/paulsha-conventions
          ref: ${{ env.POLICY_ENGINE_REF }}
          path: .policy-engine

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install policy engine
        run: python -m pip install --disable-pip-version-check ".policy-engine"

      - name: Run policy check
        shell: bash
        env:
          GITHUB_EVENT_PATH: ""
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          args=(-m policy_check --repo .)

          if [[ -n "${PR_TITLE:-}" ]]; then
            args+=(--pr-title "$PR_TITLE")
          fi
          if [[ -n "${PR_BODY:-}" ]]; then
            args+=(--pr-body "$PR_BODY")
          fi
          if [[ -n "${PR_LABELS:-}" ]]; then
            args+=(--pr-labels "$PR_LABELS")
          fi
          if [[ -n "${PR_BASE_REF:-}" ]]; then
            args+=(--pr-base-ref "$PR_BASE_REF")
          fi
          if [[ -n "${PR_HEAD_REF:-}" ]]; then
            args+=(--pr-head-ref "$PR_HEAD_REF")
          fi

          set +e
          python "${args[@]}"
          status=$?
          set -e

          if [[ -n "${GITHUB_STEP_SUMMARY:-}" && -f "${GITHUB_STEP_SUMMARY}" ]]; then
            echo "=== policy_check summary ==="
            cat "${GITHUB_STEP_SUMMARY}"
            echo "=== end policy_check summary ==="
          fi

          exit "$status"
